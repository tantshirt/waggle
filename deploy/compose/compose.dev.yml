# Local-dev overlay. Opens auth/membership and publishes admin/tool ports.
# Activate with: BUZZ_COMPOSE_DEV=true ./run.sh start
# Prefer .env.dev.example for an open local .env; do not use this on prod.

services:
  relay:
    environment:
      # Force open local hive regardless of .env / prod defaults.
      BUZZ_REQUIRE_AUTH_TOKEN: "false"
      BUZZ_REQUIRE_RELAY_MEMBERSHIP: "false"
      BUZZ_AUTO_MIGRATE: ${BUZZ_AUTO_MIGRATE:-true}

  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

  minio:
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

  adminer:
    image: adminer:latest
    container_name: buzz-adminer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_PORT:-8082}:8080"
    restart: unless-stopped
    networks:
      - buzz-net

  prometheus:
    image: prom/prometheus:latest
    container_name: buzz-prometheus
    volumes:
      - ../../prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - buzz-prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - buzz-net

volumes:
  buzz-prometheus-data:
    labels:
      com.buzz.volume: prometheus
