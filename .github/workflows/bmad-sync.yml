# Watch upstream BMAD Method releases and open a PR when the pin should move.
#
# Token hygiene: the job that runs `npx bmad-method` only has contents:read.
# Write / pull-request permissions are granted only to the follow-up job that
# applies the artifact and opens the PR — never to the untrusted installer.
name: bmad-sync

on:
  schedule:
    # Daily 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [bmad-release]

# Default: read-only. Jobs that need write declare it explicitly.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      unchanged: ${{ steps.skip.outputs.unchanged }}
      current: ${{ steps.pin.outputs.current }}
      latest: ${{ steps.latest.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned BMAD version
        id: pin
        run: |
          ver=$(grep '^BMAD_METHOD_VERSION=' BUZZ_VERSION | cut -d= -f2)
          echo "current=$ver" >> "$GITHUB_OUTPUT"

      - name: Resolve latest bmad-method on npm
        id: latest
        run: |
          latest=$(npm view bmad-method version)
          echo "version=$latest" >> "$GITHUB_OUTPUT"
          echo "Pinned: ${{ steps.pin.outputs.current }}  Latest: $latest"

      - name: Skip if unchanged
        id: skip
        run: |
          if [[ "${{ steps.pin.outputs.current }}" == "${{ steps.latest.outputs.version }}" ]]; then
            echo "unchanged=true" >> "$GITHUB_OUTPUT"
          else
            echo "unchanged=false" >> "$GITHUB_OUTPUT"
          fi

  # Install / compile with a read-only token only. Compromised package code
  # must not inherit contents:write or pull-requests:write.
  install:
    needs: check
    if: needs.check.outputs.unchanged == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"

      - name: Bump pin + install + compile
        run: |
          set -euo pipefail
          NEW="${{ needs.check.outputs.latest }}"
          sed -i "s/^BMAD_METHOD_VERSION=.*/BMAD_METHOD_VERSION=${NEW}/" BUZZ_VERSION
          MODULES=$(grep '^BMAD_MODULES=' BUZZ_VERSION | cut -d= -f2)
          npx --yes "bmad-method@${NEW}" install \
            --directory "$PWD" \
            --modules "$MODULES" \
            --tools claude-code \
            --all-stable \
            --action update \
            --yes
          cargo build -p waggle-cli
          # Offline: compile packs + identities + sync state; no relay calls.
          # --allow-unsupported lets the PR land even if BMAD_SUPPORTED needs a follow-up bump.
          ./target/debug/waggle sync --skip-install --offline --allow-unsupported --skip-global-skills
          chmod +x ./scripts/verify-sync.sh
          ./scripts/verify-sync.sh

      - name: Upload sync artifact
        uses: actions/upload-artifact@v4
        with:
          name: bmad-sync-${{ needs.check.outputs.latest }}
          path: |
            BUZZ_VERSION
            _bmad/
            packs/
            .claude/skills/
          if-no-files-found: error

  # Write-capable job: apply artifact + open PR. Does not execute npm/npx.
  open-pr:
    needs: [check, install]
    if: needs.check.outputs.unchanged == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Download sync artifact
        uses: actions/download-artifact@v4
        with:
          name: bmad-sync-${{ needs.check.outputs.latest }}
          path: .

      - name: Open or update PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/bmad-sync-${{ needs.check.outputs.latest }}
          title: "chore: sync BMAD Method ${{ needs.check.outputs.latest }}"
          commit-message: |
            chore: bump BMAD Method to ${{ needs.check.outputs.latest }}

            Regenerated packs and sync state via waggle sync.
          body: |
            ## Summary
            - Upstream `bmad-method` moved from `${{ needs.check.outputs.current }}` to `${{ needs.check.outputs.latest }}`
            - `BUZZ_VERSION` pin bumped; packs recompiled; `verify-sync.sh` passed

            ## Test plan
            - [ ] Review `_bmad/_config/manifest.yaml` / pack diffs
            - [ ] Local: `waggle sync --skip-install` against a running relay
            - [ ] Spot-check `#help` canvas and phase channel names
          add-paths: |
            BUZZ_VERSION
            _bmad/
            packs/
            .claude/skills/
