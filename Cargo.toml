[workspace]
resolver = "2"
members = [
  "crates/waggle-core",
  "crates/waggle-method",
  "crates/waggle-hive",
  "crates/waggle-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/tantshirt/waggle"

[workspace.dependencies]
waggle-core = { path = "crates/waggle-core" }
waggle-method = { path = "crates/waggle-method" }
waggle-hive = { path = "crates/waggle-hive" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
serde_norway = "0.9.42"
clap = { version = "4.6", features = ["derive"] }
thiserror = "2"
