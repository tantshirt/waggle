[workspace]
resolver = "2"
members = [
  "crates/waggle-core",
  "crates/waggle-method",
  "crates/waggle-hive",
  "crates/waggle-emit",
  "crates/waggle-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/tantshirt/waggle"

[workspace.dependencies]
waggle-core = { path = "crates/waggle-core" }
waggle-method = { path = "crates/waggle-method" }
waggle-hive = { path = "crates/waggle-hive" }
waggle-emit = { path = "crates/waggle-emit" }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.3"
serde_json = "1.0"
serde_norway = "0.9.42"
clap = { version = "4.6", features = ["derive"] }
thiserror = "2"
nostr = "0.44.6"
reqwest = { version = "0.13", features = ["json", "blocking", "rustls", "webpki-roots"], default-features = false }
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
